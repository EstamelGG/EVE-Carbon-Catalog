<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNA 配方 · EVE Carbon</title><link rel="icon" href="./mark.svg">
<link rel="stylesheet" href="./dna-editor.css">
</head>
<body>
<header><a href="./index.html"><img src="./mark.svg" alt="" width="26" height="26">EVE Carbon</a><h1>DNA 配方</h1></header>
<main>
<form id="controls">
<fieldset id="components" disabled><legend>基础组件</legend>
<label>舰体 · Hull<select id="hull"></select></label>
<label>阵营 · Faction<select id="faction"></select></label>
<label>种族 · Race<select id="race"></select></label>
</fieldset>
<fieldset id="modifiers" disabled><legend>材质与图案</legend>
<div id="materials" class="slots"></div><datalist id="palette"></datalist>
<label>投影图案<select id="pattern"></select></label><div id="pattern-slots" class="slots"></div>
<label>贴图变体 · respathinsert<select id="insert"></select></label>
</fieldset>
<label for="dna">DNA</label><textarea id="dna" rows="3" readonly spellcheck="false"></textarea>
<button id="copy" type="button" disabled>复制 DNA</button><p id="status" role="status"></p>
</form>
<section id="preview" aria-label="模型预览"><eve-model-viewer id="viewer" control-panel></eve-model-viewer></section>
</main><script type="module" src="./dna-editor.mjs"></script>
</body></html>
