<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVE Hull Viewer</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: #10171e;
        color: #e6e8e9;
      }
      main,
      eve-model-viewer {
        display: block;
        width: 100%;
        height: 100dvh;
      }
      #status {
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="status" role="status" hidden></p>
      <eve-model-viewer background="auto" hidden></eve-model-viewer>
    </main>
    <script type="module">
      import { loadPreviewRenderer } from './preview-renderer.mjs';
      import { createResourceLocator } from './resource-location.mjs';
      const viewer = document.querySelector('eve-model-viewer');
      const status = document.getElementById('status');
      let config, titleSequence = 0;
      async function englishName(id, modelIndex) {
        const indexResponse = await fetch(modelIndex, { cache: 'no-cache' });
        if (!indexResponse.ok) return '';
        const index = await indexResponse.json();
        if (typeof index.items !== 'string') return '';
        const itemURL = createResourceLocator(modelIndex)(
          `${index.items.replace(/\/?$/, '/')}${id}.json`,
        );
        const itemResponse = await fetch(itemURL, { cache: 'no-cache' });
        if (!itemResponse.ok) return '';
        const name = (await itemResponse.json()).name;
        return typeof name === 'string' ? name : name?.en || '';
      }
      try {
        config = await loadPreviewRenderer(viewer);
        const style = document.createElement('style');
        style.textContent = `
          .layout,
          #viewer-stage {
            height: 100% !important;
            min-height: 100% !important;
          }
          #viewer-stage {
            flex: 1 1 auto !important;
          }
          .footer,
          .viewer-heading,
          .viewer-dimensions {
            display: none;
          }
        `;
        viewer.shadowRoot.append(style);
        function showHull() {
          const id = location.hash.slice(1);
          const valid = /^[1-9]\d*$/.test(id) && Number.isSafeInteger(Number(id));
          const sequence = ++titleSequence;
          viewer.hidden = !valid;
          status.hidden = valid;
          status.textContent = valid ? '' : '请在网址末尾填写物品 TypeID，例如 #638。';
          document.title = 'EVE Hull Viewer';
          if (valid) {
            document.title = `Hull ${id}`;
            viewer.setAttribute('item-id', id);
            englishName(id, config.modelIndex)
              .then((name) => {
                if (name && sequence === titleSequence) document.title = name;
              })
              .catch(() => {});
          } else {
            viewer.cancel();
            viewer.clear();
          }
        }
        window.addEventListener('hashchange', showHull);
        showHull();
      } catch (error) {
        status.hidden = false;
        status.textContent = '船体查看器加载失败，请刷新重试。';
        console.error(error);
      }
    </script>
  </body>
</html>
