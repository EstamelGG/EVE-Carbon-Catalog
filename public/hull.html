<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVE 船体展示</title>
    <style>body { margin: 0; background: #10171e; color: #e6e8e9; } #status { padding: 16px; }</style>
  </head>
  <body>
    <main>
      <p id="status" role="status" hidden></p>
      <eve-model-viewer background="none" hidden></eve-model-viewer>
    </main>
    <script type="module">
      import { loadPreviewRenderer } from './preview-renderer.mjs';
      const viewer = document.querySelector('eve-model-viewer');
      const status = document.getElementById('status');
      try {
        await loadPreviewRenderer(viewer);
        const style = document.createElement('style');
        style.textContent = '.footer, .viewer-heading, .viewer-dimensions { display: none; }';
        viewer.shadowRoot.append(style);
        function showHull() {
          const id = location.hash.slice(1);
          const valid = /^[1-9]\d*$/.test(id) && Number.isSafeInteger(Number(id));
          viewer.hidden = !valid;
          status.hidden = valid;
          status.textContent = valid ? '' : '请在网址末尾填写物品 TypeID，例如 #638。';
          if (valid) viewer.setAttribute('item-id', id);
          else { viewer.cancel(); viewer.clear(); }
        }
        window.addEventListener('hashchange', showHull);
        showHull();
      } catch (error) {
        status.hidden = false;
        status.textContent = '船体查看器加载失败，请刷新重试。';
        console.error(error);
      }
    </script>
  </body>
</html>
