name: Publish Catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/model-catalog/package-lock.json
      - name: Build Catalog
        env:
          RESOURCE_BASE_URL: ${{ vars.RESOURCE_BASE_URL }}
          RENDERER_MODULE_URL: ${{ vars.RENDERER_MODULE_URL }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Catalog
        id: deployment
        uses: actions/deploy-pages@v4
