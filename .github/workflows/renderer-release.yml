name: Release Renderer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Renderer
        working-directory: renderer/model-catalog
        run: |
          npm ci
          npm run build
          cd dist
          zip -r "$RUNNER_TEMP/eve-carbon-renderer.zip" eve-model-viewer.js third-party-notices.txt vendor
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          git check-ref-format "refs/tags/$TAG"
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG"; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          gh release create --target "$GITHUB_SHA" --title "$TAG" --generate-notes -- "$TAG" renderer/model-catalog/dist/eve-model-viewer.js "$RUNNER_TEMP/eve-carbon-renderer.zip"
