<div class="viewer-overlay">
  <div class="viewer-heading">
    <h2 id="stage-title"></h2>
    <p id="stage-subtitle" lang="en" hidden></p>
    <p
      id="viewer-update-status"
      role="status"
      aria-live="polite"
      data-i18n="appearanceUpdateFailed"
      hidden
    ></p>
  </div>
  <div class="viewer-dimensions">
    <canvas id="dimension-frame" width="76" height="66" aria-hidden="true"></canvas>
    <div class="dimension-values">
      <span class="dimension-x"
        ><span data-i18n="dimensionWidth">W X</span><strong id="dimension-x">—</strong></span
      >
      <span class="dimension-y"
        ><span data-i18n="dimensionHeight">H Y</span><strong id="dimension-y">—</strong></span
      >
      <span class="dimension-z"
        ><span data-i18n="dimensionLength">L Z</span><strong id="dimension-z">—</strong></span
      >
    </div>
  </div>
  <div id="viewer-loading" class="viewer-loading" role="status">
    <span class="loading-ring"></span><strong data-i18n="loadingModel">Loading model</strong
    ><span id="loading-detail">Loading geometry and materials…</span
    ><progress id="model-progress" max="5" value="0"></progress>
    <span id="loading-count"></span>
    <ul id="loading-resources" class="loading-resources"></ul>
  </div>
</div>
